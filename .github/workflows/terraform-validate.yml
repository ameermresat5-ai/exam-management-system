name: Terraform Validate

on:
  push:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-validate.yml"

  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-validate.yml"

jobs:
  terraform-validate:
    name: Validate ${{ matrix.terraform_directory }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        terraform_directory:
          - terraform/aws-eks
          - terraform/gcp-bootstrap
          - terraform/gcp-gke

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform -chdir=${{ matrix.terraform_directory }} fmt -check

      - name: Initialize Terraform without backend
        run: terraform -chdir=${{ matrix.terraform_directory }} init -backend=false

      - name: Validate Terraform
        run: terraform -chdir=${{ matrix.terraform_directory }} validate
